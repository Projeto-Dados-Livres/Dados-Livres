services:
  app:
    image: python:3.11
    container_name: dados-livres-app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    command: bash -c "pip install -r requirements.txt && flask db upgrade && flask run --host=0.0.0.0"
